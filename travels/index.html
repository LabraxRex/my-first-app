<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travels — Kacie</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f0eef5;
      --surface: #ffffff;
      --border: #ddd8eb;
      --purple: #7c3aed;
      --text: #1a1a2e;
      --text-muted: #6b6b7a;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    header {
      max-width: 900px;
      margin: 0 auto 2.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.18s ease;
    }

    .back:hover {
      color: var(--purple);
    }

    .header-text h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .header-text h1 span {
      color: var(--purple);
    }

    .header-text p {
      font-size: 0.9375rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .grid {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.875rem;
    }

    .grid-item {
      position: relative;
      aspect-ratio: 4 / 3;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .grid-item:first-child {
      grid-column: span 2;
      aspect-ratio: 16 / 9;
    }

    .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .grid-item:hover img {
      transform: scale(1.04);
    }

    .grid-item .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.35) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .grid-item:hover .overlay {
      opacity: 1;
    }

    @media (max-width: 640px) {
      body {
        padding: 2rem 1.25rem;
      }

      .grid {
        grid-template-columns: 1fr 1fr;
        gap: 0.625rem;
      }

      .grid-item:first-child {
        grid-column: span 2;
      }
    }

    @media (max-width: 400px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .grid-item:first-child {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="back" href="../index.html">← Back</a>
    <div class="header-text">
      <h1>🌍 <span>Bali</span>, Indonesia</h1>
      <p>Places explored around the world</p>
    </div>
  </header>

  <div class="grid">
    <div class="grid-item">
      <img src="https://images.unsplash.com/photo-1577717903315-1691ae25ab3f?fm=jpg&q=80&w=1200&auto=format&fit=crop" alt="Bali 1" loading="lazy" />
      <div class="overlay"></div>
    </div>
    <div class="grid-item">
      <img src="https://images.unsplash.com/photo-1604999333679-b86d54738315?fm=jpg&q=80&w=800&auto=format&fit=crop" alt="Bali 2" loading="lazy" />
      <div class="overlay"></div>
    </div>
    <div class="grid-item">
      <img src="https://images.unsplash.com/photo-1555400038-63f5ba517a47?fm=jpg&q=80&w=800&auto=format&fit=crop" alt="Bali 3" loading="lazy" />
      <div class="overlay"></div>
    </div>
    <div class="grid-item">
      <img src="https://images.unsplash.com/photo-1537996194471-e657df975ab4?fm=jpg&q=80&w=800&auto=format&fit=crop" alt="Bali 4" loading="lazy" />
      <div class="overlay"></div>
    </div>
    <div class="grid-item">
      <img src="https://images.unsplash.com/photo-1539367628448-4bc5c9d171c8?fm=jpg&q=80&w=800&auto=format&fit=crop" alt="Bali 5" loading="lazy" />
      <div class="overlay"></div>
    </div>
    <div class="grid-item">
      <img src="https://images.unsplash.com/photo-1544644181-1484b3fdfc62?fm=jpg&q=80&w=800&auto=format&fit=crop" alt="Bali 6" loading="lazy" />
      <div class="overlay"></div>
    </div>
    <div class="grid-item">
      <img src="https://images.unsplash.com/photo-1573790387438-4da905039392?fm=jpg&q=80&w=800&auto=format&fit=crop" alt="Bali 7" loading="lazy" />
      <div class="overlay"></div>
    </div>
    <div class="grid-item">
      <img src="https://images.unsplash.com/photo-1558005530-a7958896ec60?fm=jpg&q=80&w=800&auto=format&fit=crop" alt="Bali 8" loading="lazy" />
      <div class="overlay"></div>
    </div>
  </div>
</body>
</html>
